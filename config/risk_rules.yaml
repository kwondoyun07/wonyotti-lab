# 리스크 엔진 규칙. AI(모델·Jev)가 무엇을 제안하든 이 규칙이 최종 거부권을 가집니다.
# "출처"가 붙은 값은 워뇨띠 본인 발언 기반, "임의값"은 출발점일 뿐이니 검증하며 조정하세요.

# 1회 최대 허용 손실(계좌 대비). 격리 증거금을 이 비율 이하로 묶어 그 이상 잃지 않게 한다.
# 출처: 2025.9 AMA — 시드가 작을 땐 -20%, 요즘은 -10%
max_loss_per_position: 0.10

# 계좌 대비 달러 기준 순노출 상·하한 (1.0 = 자기자본만큼 BTC 롱, -1.0 = 그만큼 숏)
# 출처: 2025.6 인터뷰 최대 1.5~2배, 2025.9 AMA 최근엔 1배 이하
max_net_exposure: 1.0
min_net_exposure: -1.0

# 변동성 역비례 사이징: 최근 일간 변동성이 이 값보다 크면 목표 노출을 비례해 줄인다.
# 원칙 출처: 2025.9 AMA "변동성이 클수록 포지션을 적게". 수치 0.03은 임의값.
target_daily_vol: 0.03

# 하루 손실이 계좌의 이 비율에 닿으면 다음 UTC 0시까지 위험을 늘리는 주문 금지.
# 근거: 공개 거래내역 커뮤니티 분석(큰 손실 다음 날 주문이 거의 없음). 수치 0.05는 임의값.
daily_loss_limit: 0.05

# 모델·Jev 확신도가 이 값보다 낮으면 관망(위험을 늘리는 주문 금지).
# 임의값 — 내 로그로 확신도와 실제 적중률을 대조해 보정한 뒤 조정.
min_confidence: 0.6
